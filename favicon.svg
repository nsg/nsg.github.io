<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- three rack units with status lights; follows the OS colour scheme -->
  <style>
    .bg { fill: #f4f1ea; }
    .u  { fill: #1c1a17; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1526; }
      .u  { fill: #e6ecf5; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <rect class="u" x="5" y="6.5"  width="22" height="5" rx="1.2"/>
  <rect class="u" x="5" y="13.5" width="22" height="5" rx="1.2"/>
  <rect class="u" x="5" y="20.5" width="22" height="5" rx="1.2"/>
  <circle fill="#3ddc84" cx="23.5" cy="9"  r="1.3"/>
  <circle fill="#ffb454" cx="23.5" cy="16" r="1.3"/>
  <circle fill="#3ddc84" cx="23.5" cy="23" r="1.3"/>
</svg>
